services:
  - type: web
    name: mini-project-ats-api
    runtime: node
    buildCommand: npm install
    startCommand: npm run start --workspace=server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: CLIENT_URL
        sync: false
